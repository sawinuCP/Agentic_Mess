name: ai-harness

# Phase 0 local infrastructure.
# Default stack: PostgreSQL (source of truth), Redis (leases/cache), NATS JetStream (events/transport).
# Heavy components are opt-in via profiles so the default dev loop stays fast:
#   docker compose --profile temporal up -d        # durable workflow engine (Phase 3+)
#   docker compose --profile observability up -d   # OpenTelemetry collector
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      # Host ports are offset (15432 etc.) because Windows dev machines commonly run
      # local PostgreSQL/Redis on the standard ports; loopback binds would win.
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "14222:4222"
      - "18222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  temporal:
    profiles: ["temporal"]
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
    ports:
      - "7233:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy

  temporal-postgres:
    profiles: ["temporal"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 12

  temporal-ui:
    profiles: ["temporal"]
    image: temporalio/ui:2.26.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  pgdata:
  temporal_pgdata:
